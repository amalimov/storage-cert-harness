# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: go
reviews:
  profile: assertive
  high_level_summary: true
  poem: false
  request_changes_workflow: false
  auto_review:
    enabled: true
    drafts: false
path_instructions:
  - path: internal/tools/**
    instructions: |
      Flag hardcoded numeric SLA or threshold values in Go sources (not testdata/).
      SLA values are public and belong in the KB thresholds bundle (ADR-0017);
      this is a data-ownership rule, not a secrecy rule.
      Every new tool package must include a golden-file parser test (*_test.go plus testdata/).
      Tool adapters must consume gates from the thresholds bundle instead of
      embedding gate values in source.
  - path: "internal/{orchestrator,grader,stages,core,kb}/**"
    instructions: |
      Architectural changes should reference an ADR under decisions/. Flag PRs that
      change ports, scoring, or the KB join without a decisions/ link.
  - path: decisions/**
    instructions: |
      ADRs must follow decisions/template.md (Context, Decision, Options, Consequences).
